async function lectureParts(lec) {
  const parts = [];
  const blobs = lec.hasParts ? await DB.getParts(lec.id) : [];
  if (blobs.length) {
    if (blobs.some(b => b.rendered)) parts.push({text: 'الصور التالية هي صفحات المحاضرة بالترتيب:'});
    for (const b of blobs) parts.push({inline_data: {mime_type: b.mime, data: b.data}});
  }
  const textUnits = (lec.units || []).filter(u => !u.bin && u.text && u.text.trim());
  if (textUnits.length) {
    let txt = textUnits.map(u => `[${u.label}]\n${u.text}`).join('\n\n');
    if (txt.length > 600000) txt = txt.slice(0, 600000) + '\n…(تم اختصار بقية النص)';
    parts.push({text: `=== نص المحاضرة «${lec.title}» (الوسوم بين [] تشير لرقم الشريحة/الصفحة) ===\n${txt}\n=== نهاية المحاضرة ===`});

}

async function aiJSON(lec, prompt, schema, validate, {temperature = 0.4, system} = {}) {
  const contents = await aiContents(lec, prompt);
  let lastErr = null;
  for (let i = 0; i < 2; i++) {
    const txt = await geminiRequest({contents, system: system || systemPrompt(), json: true, schema, temperature});
    const obj = parseJSONLoose(txt);
    if (obj && (!validate || validate(obj))) return obj;
    lastErr = new AIError('وصل رد غير مكتمل من الذكاء الاصطناعي. حاول مرة أخرى.', 'parse', true);
    contents[0].parts.push({text: 'تنبيه مهم: الرد السابق لم يكن JSON صالحاً أو كان ناقصاً. أعد الإجابة بـ JSON صالح فقط ومطابق للمخطط تماماً، وبعدد عناصر أقل إن لزم.'});
  }

}
async function aiStream(lec, prompt, onChunk, {temperature = 0.7, system, history} = {}) {
  let contents = await aiContents(lec, prompt);
  if (history) contents = history(contents);
  try { return await geminiRequest({contents, system: system || systemPrompt(), stream: true, onChunk, temperature}); }
  catch (e) { if (e.code === 'network' || e.name === 'TypeError') return await geminiRequest({contents, system: system || systemPrompt(), onChunk, temperature}).then(t => { onChunk && onChunk(t, t); return t; }); throw e; }
}

const S = {

  arr: items => ({type: 'ARRAY', items}), obj: (properties, required) => ({type: 'OBJECT', properties, required: required || Object.keys(properties)})
};
const SCHEMA = {

    title: S.str, summary: S.str, difficulty: {type: 'STRING', enum: ['سهل', 'متوسط', 'صعب']}, studyMinutes: S.int, lectureLanguage: S.str,
    keyPoints: S.arr(S.str),
    outline: S.arr(S.obj({title: S.str, summary: S.str, ref: S.str, subtopics: S.arr(S.str)})),
    glossary: S.arr(S.obj({term: S.str, definition: S.str, example: S.str, sectionIndex: S.int, aliases: S.arr(S.str), confusedWith: S.str, leadsTo: S.str, abbr: S.str, category: {type: 'STRING', enum: ['structure', 'function', 'disease', 'drug', 'concept']}}, ['term', 'definition', 'example'])),
    suggestedQuestions: S.arr(S.str)
  }),
  check: S.obj({question: S.str, options: S.arr(S.str), correctIndex: S.int, explanation: S.str}),
  quiz: S.obj({questions: S.arr(S.obj({type: {type: 'STRING', enum: ['mcq', 'tf', 'fill']}, question: S.str, options: S.arr(S.str), correctIndex: S.int, answer: S.str, alternatives: S.arr(S.str), explanation: S.str, optionExplanations: S.arr(S.str), section: S.str, sectionIndex: S.int, ref: S.str}, ['type', 'question', 'explanation']))}),
  cards: S.obj({cards: S.arr(S.obj({front: S.str, back: S.str, section: S.str}))}),
  grade: S.obj({score: S.int, verdict: S.str, correct: S.arr(S.str), missed: S.arr(S.str), misconceptions: S.arr(S.str), modelAnswer: S.str, tip: S.str}),
  rapid: S.obj({questions: S.arr(S.obj({question: S.str, answer: S.str, keywords: S.arr(S.str)}))}),
  short: S.obj({score: S.int, correct: S.bool, feedback: S.str}),
  predict: S.obj({questions: S.arr(S.obj({question: S.str, type: S.str, likelihood: {type: 'STRING', enum: ['عالية', 'متوسطة', 'منخفضة']}, why: S.str, modelAnswer: S.str}))})
};
function normQuiz(qs) {
  const tf = Settings.get('lang', 'ar') === 'en_terms' ? ['True', 'False'] : ['صح', 'خطأ'];
  return (qs || []).map(q => {
    q = {...q, id: uid()};
    if (q.type === 'tf') { const ci = Number.isInteger(q.correctIndex) ? q.correctIndex : (/^(true|صح|صحيح)/i.test(q.answer || '') ? 0 : 1); q.options = tf; q.correctIndex = ci === 0 ? 0 : 1; if (!q.optionExplanations || q.optionExplanations.length !== 2) q.optionExplanations = []; }
    else if (q.type === 'fill') { if (!q.answer && q.options && q.options[q.correctIndex]) q.answer = q.options[q.correctIndex]; if (!/_{3,}|\.\.\.|…/.test(q.question)) q.question += ' ______'; q.options = []; }
    else {
      q.type = 'mcq';
      if (!Array.isArray(q.options) || q.options.length < 2 || !(q.correctIndex >= 0 && q.correctIndex < q.options.length)) return null;
      const ex = q.optionExplanations && q.optionExplanations.length === q.options.length ? q.optionExplanations : q.options.map(() => '');
      const order = shuffle(q.options.map((_, i) => i));
      q.options = order.map(i => q.options[i]); q.optionExplanations = order.map(i => ex[i]); q.correctIndex = order.indexOf(q.correctIndex);
    }
    if (q.type === 'fill' && !q.answer) return null;
    return q;
  }).filter(Boolean);
}

`### 🧒 The idea, simply\nThe heart is a **house with four rooms**: two upper rooms **receive** blood, two lower rooms **pump** it out.\n\n### 📖 Step by step\n1. [[Right atrium|right atrium|anatomy]]: receives **deoxygenated** blood returning from the body.\n2. [[Right ventricle|right ventricle|anatomy]]: pumps it to the [[lungs|lung|anatomy]] to pick up oxygen.\n3. [[Left atrium|left atrium|anatomy]]: receives **oxygenated** blood from the lungs.\n4. [[Left ventricle|left ventricle|anatomy]]: pumps it to the whole body — so its wall is much thicker (about 3×).\n5. [[Septum|interventricular septum|anatomy]]: the wall that keeps right and left blood apart.\n\n> 💡 **Trick:** Atrium = Arrive · Ventricle = Vent out.`,
`### 🧒 The idea, simply\nBetween the rooms there are **one-way doors** (valves) so blood only moves forward.\n\n### 📖 Step by step\n1. Right atrium → right ventricle: [[tricuspid valve|tricuspid valve|anatomy]] (3 cusps).\n2. Left atrium → left ventricle: [[mitral valve|mitral valve|anatomy]] (2 cusps, shaped like a bishop's mitre).\n3. The cusps are held by [[chordae tendineae|chordae tendineae|anatomy]] anchored to [[papillary muscles|papillary muscle|anatomy]] — like tent ropes.\n4. Exits: [[pulmonary valve|pulmonary valve|anatomy]] (right ventricle) and [[aortic valve|aortic valve|anatomy]] (left ventricle).\n5. "Lub" = S1 (tricuspid + mitral close), "dub" = S2 (pulmonary + aortic close).`,
`### 🧒 The idea, simply\nBlood makes **two trips**: a short one to the lungs to load oxygen, and a long one to the body to deliver it.\n\n### 📖 Step by step\n1. In through the [[superior|superior vena cava|anatomy]] and [[inferior vena cava|inferior vena cava|anatomy]] → right atrium.\n2. Tricuspid valve → right ventricle.\n3. Pulmonary valve → [[pulmonary artery|pulmonary artery|anatomy]] → lungs (oxygen loaded).\n4. Back via the [[pulmonary veins|pulmonary veins|anatomy]] → left atrium.\n5. Mitral valve → left ventricle.\n6. Aortic valve → [[aorta|aorta|anatomy]] → whole body.\n\nThe heart feeds itself through the [[coronary arteries|coronary arteries|anatomy]] — the first branches of the aorta.\n\n> ⚠️ **Classic trap:** the pulmonary artery carries **deoxygenated** blood — it is an artery because it leaves the heart.`,
`### 🧒 The idea, simply\nThe heart wall has **3 layers**, and it has its own built-in **electrical wiring**.\n\n### 📖 Step by step\n1. Layers: [[epicardium|epicardium|anatomy]] → [[myocardium|myocardium|anatomy]] → [[endocardium|endocardium|anatomy]].\n2. The [[SA node|sinoatrial node|anatomy]] in the right atrium fires 60–100 times per minute.\n3. The [[AV node|atrioventricular node|anatomy]] delays the signal ~0.1 s so the ventricles can fill.\n4. Then the [[bundle of His|bundle of His|anatomy]] → [[Purkinje fibers|Purkinje fibers|anatomy]] → the ventricles contract.\n5. We record this electricity with an [[ECG|electrocardiography|diagram]].\n\n> 💡 **Trick:** "Sami Ate Hot Pizza" = SA → AV → His → Purkinje.`];

الجلطة القلبية (**احتشاء عضلة القلب**) تبدأ غالباً بـ**تمزّق لويحة دهنية** داخل أحد ${v('cor')}. الجسم يحسبها جرح، فتتجمّع الصفائح وتتكون **خثرة** تسدّ الشريان. الجزء من ${v('myo')} اللي بعد الانسداد يفقد الأكسجين، وتبدأ خلاياه تموت خلال **20–40 دقيقة** تقريباً — عشان كذا يقولون: **«الوقت = عضلة»**.

### 🧭 الأسباب والانتشار
- أمراض القلب التاجية من **أكثر أسباب الوفاة** في العالم.
- عوامل الخطر: التدخين، السكري، ارتفاع الضغط، ارتفاع الكوليسترول، السمنة، قلة الحركة، والتاريخ العائلي.
- الشريان الأمامي النازل الأيسر (**LAD**) انسداده خطير لدرجة يسمّونه «صانع الأرامل».

### 🩺 كيف يظهر
ألم **ضاغط** في الصدر أكثر من 20 دقيقة، ممكن ينتشر للذراع اليسرى أو الفك، مع **تعرّق** وغثيان وضيق نفس. ⚠️ عند **النساء وكبار السن ومرضى السكري** ممكن تكون الأعراض غير واضحة (تعب، ضيق نفس، ألم بطن) أو حتى «صامتة».

### 📜 قصة الاكتشاف
- **1912:** الطبيب الأمريكي **جيمس هيريك** وصف أعراض انسداد الشرايين التاجية عند مريض حي.

- **1977:** **أندرياس غرونتزيغ** سوّى أول توسيع شريان تاجي بالبالون في زيورخ.

- عضلة القلب **ما تتجدد** تقريباً بعد الجلطة؛ المكان الميت يتحول **ندبة**.

/* ---------------- Study plan (local, deterministic) ---------------- */
function buildPlan(lec, examDate, daily) {
  const ov = lec.cache.overview; const secs = ov.outline; const today = new Date(dayKey()); const exam = new Date(examDate);
  const days = Math.max(1, Math.round((exam - today) / DAY)); const perSec = Math.max(10, Math.round((ov.studyMinutes || 45) * 1.2 / secs.length));
  const tasks = [];
  secs.forEach((s, i) => tasks.push({title: `اشرح لي: ${s.title}`, min: perSec, tab: 'tutor', sec: i, phase: 1}));
  secs.forEach((s, i) => { if (i % 2 === 1 || i === secs.length - 1) tasks.push({title: `اختبار قصير على الأقسام حتى «${s.title}»`, min: 10, tab: 'quiz', phase: 1}); });
  secs.forEach((s, i) => tasks.push({title: `سمّع: ${s.title}`, min: 8, tab: 'recite', sec: i, phase: 2}));
  tasks.push({title: 'اختبار شامل (٢٠ سؤال) + اختبرني في أخطائي', min: 25, tab: 'quiz', phase: 2});
  tasks.push({title: 'راجع الخريطة الذهنية كاملة', min: 10, tab: 'mindmap', phase: 2});
  const final = [{title: 'اقرأ ملخص ليلة الاختبار', min: 15, tab: 'cheat'}, {title: 'جاوب الأسئلة المتوقعة', min: 25, tab: 'predict'}, {title: 'سمّع لي: جولة سريعة على كل الأقسام', min: 10, tab: 'recite'}];
  const plan = []; const cardsT = () => ({title: 'راجع الكروت المستحقة', min: Math.min(15, Math.max(5, Math.round(daily * .15))), tab: 'cards'});
  const studyDays = days > 1 ? days - 1 : 1; const queue = tasks.slice();
  for (let d = 0; d < studyDays; d++) {
    const date = new Date(today.getTime() + d * DAY); const day = {date: dayKey(date), tasks: []}; let used = 0;
    if (d > 0 || days === 1) { const c = cardsT(); day.tasks.push(c); used += c.min; }
    const remainingDays = studyDays - d; const share = Math.ceil(queue.length / remainingDays);
    let taken = 0;
    while (queue.length && (used + queue[0].min <= daily || day.tasks.length === 0 || taken < share && used < daily * 1.25)) { const t = queue.shift(); day.tasks.push(t); used += t.min; taken++; if (used >= daily * 1.25) break; }
    plan.push(day);
  }
  if (queue.length) plan[plan.length - 1].tasks.push(...queue);
  if (days > 1) plan.push({date: dayKey(new Date(today.getTime() + (days - 1) * DAY)), tasks: [cardsT(), ...final], final: true}); else plan[0].tasks.push(...final);
  plan.forEach(d => d.tasks = d.tasks.map(t => ({...t, id: uid(), done: false})));
  return {exam: examDate, daily, created: Date.now(), days: plan};
}

  const cards = lec.cards || []; const mastered = cards.filter(c => c.box >= 4).length; const reviewed = cards.filter(c => c.reviews).length;
  const rec = P.recitations || []; const recAvg = rec.length ? (rec.reduce((a, r) => a + r.score, 0) / rec.length).toFixed(1) : '—';
  const streak = Activity.streak(); const act = Activity.data(); const today = act[dayKey()] || {};

async function fetchModels(key) {
  let res; try { res = await fetch(`${API_BASE}/models?pageSize=1000`, {headers: {'x-goog-api-key': key}}); } catch { throw new AIError('تعذّر الاتصال بـ Google. تحقق من الإنترنت.', 'network'); }
  if (!res.ok) { let b = null; try { b = await res.json(); } catch {} throw mapApiError(res.status, b, ''); }
  const j = await res.json();
  const list = (j.models || []).filter(m => /gemini/i.test(m.name) && (m.supportedGenerationMethods || []).includes('generateContent') && !/embedding|tts|image|live|audio|aqa|robotics|computer-use|learnlm/i.test(m.name))
    .map(m => ({id: m.name.replace(/^models\//, ''), label: m.displayName || m.name.replace(/^models\//, '')}));
  list.sort((a, b) => (b.id === DEFAULT_MODEL) - (a.id === DEFAULT_MODEL) || (/latest|exp|preview/.test(a.id) - /latest|exp|preview/.test(b.id)) || b.id.localeCompare(a.id));
  if (list.length) { Settings.set('models', list); const bad = Settings.get('badModels', []); const cur = modelName(); if (!list.some(m => m.id === cur) || bad.includes(cur)) { const best = pickBestModel(list, [cur, ...bad]); if (best) Settings.set('model', best); } }
  return list;
}
function modelScore(id) {
  const v = parseFloat((id.match(/gemini-(\d+(?:\.\d+)?)/) || [])[1] || '0');
  let s = v * 100;
  if (/flash/.test(id)) s += 50; if (/lite/.test(id)) s -= 30; if (/pro/.test(id)) s += 10;
  if (/preview|exp/.test(id)) s -= 5; if (/latest/.test(id)) s -= 2; if (/\d{3,}$|-\d{2}-\d{2}/.test(id)) s -= 3;
  return s;
}
function pickBestModel(list, exclude = []) { const c = list.filter(m => !exclude.includes(m.id)).sort((a, b) => modelScore(b.id) - modelScore(a.id)); return c.length ? c[0].id : null; }

const Pomo = {
  modes: {focus: [25, 'تركيز'], short: [5, 'استراحة قصيرة'], long: [15, 'استراحة طويلة']},
  mode: 'focus', remaining: 25 * 60, end: 0, running: false, open: false, t: null, count: 0,
  fmt() { const s = Math.max(0, Math.round(this.running ? (this.end - Date.now()) / 1000 : this.remaining)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); },
  toggleWidget() { this.open = !this.open; this.render(); },
  set(m) { this.mode = m; this.running = false; clearInterval(this.t); this.remaining = this.modes[m][0] * 60; this.render(); renderChrome(); },
  start() { if (this.running) { this.remaining = Math.round((this.end - Date.now()) / 1000); this.running = false; clearInterval(this.t); } else { this.end = Date.now() + this.remaining * 1000; this.running = true; this.t = setInterval(() => this.tick(), 500); } this.render(); renderChrome(); },
  reset() { this.set(this.mode); },
  tick() {
    const left = (this.end - Date.now()) / 1000;
    const tv = $('#pomo .ptime'); if (tv) tv.textContent = this.fmt(); const mb = $('#pomo-btn .pomo-mini'); if (mb) mb.textContent = this.fmt();
    if (left <= 0) { clearInterval(this.t); this.running = false; this.beep();
      if (this.mode === 'focus') { this.count++; Activity.mark('pomo'); toast('🍅 خلصت جلسة تركيز! خذ استراحة قصيرة', 'ok', 6000); this.set(this.count % 4 === 0 ? 'long' : 'short'); }
      else { toast('⏰ انتهت الاستراحة — يلا نرجع للمذاكرة!', 'ok', 6000); this.set('focus'); }
      try { if ('Notification' in window && Notification.permission === 'granted') new Notification('ذاكِر', {body: this.mode === 'focus' ? 'انتهت الاستراحة' : 'انتهت جلسة التركيز 🍅'}); } catch {} }
  },
  beep() { try { const C = new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach(d => { const o = C.createOscillator(), g = C.createGain(); o.frequency.value = 880; o.connect(g); g.connect(C.destination); g.gain.setValueAtTime(.0001, C.currentTime + d); g.gain.exponentialRampToValueAtTime(.3, C.currentTime + d + .02); g.gain.exponentialRampToValueAtTime(.0001, C.currentTime + d + .2); o.start(C.currentTime + d); o.stop(C.currentTime + d + .22); }); } catch {} },

function rivalBar(Q) { const R = Q.rival; const me = Q.answers.filter(a => a && a.ok).length; const n = Q.qs.length; return `<div class="rival"><div class="rv-row"><span>أنت</span><div class="progress"><i style="width:${me / n * 100}%"></i></div><b>${arNum(me)}</b></div><div class="rv-row bot"><span>🤖 ذاكِر بوت</span><div class="progress"><i style="width:${R.score / n * 100}%"></i></div><b>${arNum(R.score)}</b></div></div>`; }
function rivalStep(Q, ok) { const R = Q.rival; const hit = Math.random() < R.p; if (hit) R.score++; R.hist.push(hit); R.p = clamp(R.p + (ok ? .05 : -.06), .35, .95); const bar = $('.rival'); if (bar) bar.outerHTML = rivalBar(Q); }
function rivalResult(Q, score) { const R = Q.rival; const w = score > R.score ? 'win' : score === R.score ? 'tie' : 'lose'; if (w === 'win') setTimeout(() => confetti(90), 300); return `<div class="card race-res ${w}"><div class="race-av">${w === 'win' ? '🏆' : w === 'tie' ? '🤝' : '🤖'}</div><div><h3 style="margin:0">${w === 'win' ? 'غلبت ذاكِر بوت!' : w === 'tie' ? 'تعادل!' : 'ذاكِر بوت فاز هالمرة'}</h3><div class="small muted">أنت ${arNum(score)} · البوت ${arNum(R.score)}</div></div></div>`; }

  compact: qs => qs.map(q => ({type: q.type, question: q.question, options: q.options, correctIndex: q.correctIndex, answer: q.answer, alternatives: q.alternatives, explanation: q.explanation, section: q.section})),
  enc(o) { const s = JSON.stringify(o); return btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  dec(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); const b = atob(s); return JSON.parse(new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0)))); },
  link(c) { const best = c.rows.slice().sort((a, b) => b.score - a.score)[0]; return location.href.split('#')[0] + '#/challenge/' + this.enc({id: c.id, t: c.title, by: c.by, q: c.qs, r: c.rows.slice(0, 20)}); },

  const intro = fey ? `<div class="empty" style="margin:auto"><div class="big">🧒</div><h3 style="margin:4px 0">أنا سعود، عمري ١٠ سنين 👋</h3><div class="small">علّمني «${esc(S.topic || ov.outline[0].title)}»! بسألك أسئلة لو ما فهمت.</div></div>` : '';

    const bub = $('.bubble', wrap); const el = document.createElement('div'); el.className = 'md no-enh'; const paint = makePainter(el); let st = false;

    catch (e) { if (text) S.hist.pop(); bub.innerHTML = errorCard(e); bindErrorCard(() => { wrap.remove(); ask(text); }, bub); }
    finally { busy = false; }
  };
  const send = () => { const t = input.value.trim(); if (!t) return; input.value = ''; input.style.height = 'auto'; ask(t); };
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(140, input.scrollHeight) + 'px'; });

  if (fey) { if (!S.topic) S.topic = ov.outline[0].title; $('#lb-topic').onchange = e => { S.topic = e.target.value; S.hist = []; S.result = null; saveLec(lec); CUSTOM.feynman(lec); }; }

}
function drawLab(lec) {
  const targets = [...new Set([...visualTerms(lec).filter(v => v.t === 'anatomy' || v.t === 'diagram').map(v => v.label), ...lec.cache.overview.outline.map(s => s.title)])];

    <div class="card draw-card"><div class="dw-tools" role="toolbar">${['#1f2937', '#d9577a', '#4f8fd9', '#0ea5a4', '#e08a3c'].map((c, i) => `<button class="dw-c ${i ? '' : 'on'}" data-c="${c}" style="--c:${c}" aria-label="لون"></button>`).join('')}<span class="sep"></span><button class="icon-btn" id="dw-er" aria-label="ممحاة" title="ممحاة">⌫</button><button class="icon-btn" id="dw-undo" aria-label="تراجع" title="تراجع">${icon('prev')}</button><button class="icon-btn" id="dw-clr" aria-label="مسح" title="مسح الكل">${icon('trash')}</button><span class="spacer"></span><button class="btn btn-sm btn-ghost" id="dw-ref">${icon('eye')} الصورة الصحيحة</button></div>
    <canvas id="dw-cv" aria-label="لوحة الرسم"></canvas><div class="tiny muted">ارسم بإصبعك أو القلم (Apple Pencil يدعم الضغط). اكتب أسماء الأجزاء على الرسمة.</div></div>
    <div class="cta-row"><button class="btn btn-primary btn-lg" id="dw-go">${icon('check')} صحّح رسمتي</button></div><div id="dw-res"></div>`);
  const cv = $('#dw-cv'); const ctx = cv.getContext('2d'); let color = '#1f2937', erase = false; const strokes = []; let cur = null;
  const size = () => { const w = cv.parentElement.clientWidth - 2; const h = Math.round(Math.min(560, Math.max(320, w * .7))); const r = devicePixelRatio || 1; cv.width = w * r; cv.height = h * r; cv.style.width = w + 'px'; cv.style.height = h + 'px'; ctx.setTransform(r, 0, 0, r, 0, 0); redraw(); };
  const redraw = () => { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height); for (const s of strokes) { ctx.strokeStyle = s.erase ? '#ffffff' : s.c; ctx.lineCap = ctx.lineJoin = 'round'; for (let i = 1; i < s.p.length; i++) { const a = s.p[i - 1], b = s.p[i]; ctx.lineWidth = s.erase ? 22 : 1.5 + 3.5 * (b[2] || .5); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); } } };

  cv.addEventListener('pointerdown', e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch {} cur = {c: color, erase, p: [pt(e)]}; strokes.push(cur); });
  cv.addEventListener('pointermove', e => { if (!cur) return; e.preventDefault(); const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e]; evs.forEach(x => cur.p.push(pt(x))); redraw(); });
  const end = () => { cur = null; }; cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  $$('.dw-c').forEach(b => b.onclick = () => { color = b.dataset.c; erase = false; $$('.dw-c').forEach(x => x.classList.toggle('on', x === b)); $('#dw-er').classList.remove('on'); });
  ($('#dw-er') || {}).onclick = e => { erase = !erase; e.currentTarget.classList.toggle('on', erase); };
  ($('#dw-undo') || {}).onclick = () => { strokes.pop(); redraw(); }; ($('#dw-clr') || {}).onclick = () => { strokes.length = 0; redraw(); };
  ($('#dw-ref') || {}).onclick = e => { const t = $('#dw-t').value; const v = visualTerms(lec).find(x => x.label === t); const f = document.createElement('button'); f.className = 'vt'; f.dataset.q = v ? v.q : t; f.dataset.k = v ? v.t : 'diagram'; f.dataset.l = t; const r = e.currentTarget.getBoundingClientRect(); f.getBoundingClientRect = () => r; Object.defineProperty(f, 'isConnected', {value: true}); VT.toggle(f); };
  ($('#dw-go') || {}).onclick = async () => {
    if (strokes.length < 3) return toast('ارسم شوي أكثر أول ✏️', '', 1800);
    const b64 = cv.toDataURL('image/png').split(',')[1]; const t = $('#dw-t').value; ($('#dw-res') || {}).innerHTML = `<div class="card">${thinking('المصحح يشوف رسمتك…')}</div>`;
    try { const g = await AI.drawGrade(lec, t, b64); Activity.mark('tool'); ($('#dw-res') || {}).innerHTML = `<div class="card fade-in"><div class="row nowrap" style="gap:16px">${g.score != null ? ringHTML(g.score * 10, arNum(g.score) + '/١٠', true, scoreColor(g.score * 10)) : ''}<h3 style="margin:0;font-size:1.02rem">${esc(g.verdict)}</h3></div><div class="grid g2" style="margin-top:12px"><div><h4 class="ok-h">✓ صحيح</h4><ul class="list-ok">${(g.correct || []).map(x => `<li>${rich(x)}</li>`).join('')}</ul></div><div><h4 class="miss-h">${g.score == null ? '☐ لازم تكون في رسمتك' : '✗ ناقص'}</h4><ul class="list-miss">${(g.missing || []).map(x => `<li>${rich(x)}</li>`).join('')}</ul></div></div>${(g.wrong || []).length ? `<h4>⚠️ أخطاء</h4><ul>${g.wrong.map(x => `<li>${rich(x)}</li>`).join('')}</ul>` : ''}${g.tip ? `<div class="callout c-tip">💡 ${rich(g.tip)}</div>` : ''}</div>`; }

/* ---------- command palette (Ctrl/⌘ + K) ---------- */
const Palette = {
  open() {
    if ($('.palette')) return; const lec = App.lec;
    const items = [['#/', '🏠 الرئيسية — مكتبتي'], ['#/remind', '↺ ذكّرني — مراجعة يومية']];
    if (lec) { Object.entries(TABS).forEach(([k, t]) => items.push([lecUrl(k), `${t.e || '•'} ${t.label}`])); Object.entries(TOOLS).forEach(([k, t]) => items.push([lecUrl('tools') + '/' + k, `${t.e} ${t.t}`])); }
    items.push(['act:settings', '⚙️ الإعدادات'], ['act:theme', '🌓 تبديل الوضع الليلي'], ['act:reading', '📖 وضع القراءة'], ['act:upload', '⬆️ رفع محاضرة']);
    openModal({title: 'انتقل بسرعة', icon: 'search', body: `<input class="input" id="pl-q" placeholder="اكتب اسم صفحة أو أداة…" autocomplete="off"><div class="pl-list" id="pl-l" role="listbox"></div>`, onMount: (bg, close) => {
      const q = $('#pl-q', bg), l = $('#pl-l', bg); let sel = 0; let shown = items;
      const draw = () => { const n = normAr(q.value); shown = items.filter(([, t]) => !n || normAr(t).includes(n)).slice(0, 40); sel = clamp(sel, 0, Math.max(0, shown.length - 1)); l.innerHTML = shown.map(([h, t], i) => `<button class="pl-it ${i === sel ? 'on' : ''}" data-i="${i}" role="option" aria-selected="${i === sel}">${esc(t)}</button>`).join('') || '<div class="small muted" style="padding:10px">لا نتائج</div>'; };
      const run = i => { const it = shown[i]; if (!it) return; close(); const [h] = it; if (h.startsWith('act:')) { const a = h.slice(4); if (a === 'settings') openSettings(); else if (a === 'theme') setTheme(isDark() ? 'light' : 'dark'); else if (a === 'reading') Reading.toggle(true); else if (a === 'upload') { location.hash = '#/'; $('#file-input').click(); } } else location.hash = h; };
      q.addEventListener('input', () => { sel = 0; draw(); });
      q.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { sel++; draw(); e.preventDefault(); } else if (e.key === 'ArrowUp') { sel--; draw(); e.preventDefault(); } else if (e.key === 'Enter') { e.preventDefault(); run(sel); } });
      l.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) run(+b.dataset.i); });
      draw(); }});
  }
};
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); Palette.open(); } });
