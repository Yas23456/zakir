      r.onsuccess = () => { this._db = r.result; this._db.onversionchange = () => { try { this._db.close(); } catch {} this._db = null; toast('تحدّث ذاكِر في تبويب ثاني — حدّث هذي الصفحة', 'warn', 8000); }; res(r.result); };
      r.onblocked = () => toast('ذاكِر مفتوح في تبويب ثاني بنسخة أقدم — سكّره أو حدّثه عشان نكمل', 'warn', 8000);
      r.onerror = () => { console.warn('IndexedDB unavailable, using memory'); this._mem = {lectures: new Map(), blobs: new Map(), images: new Map(), meta: new Map(), canvas: new Map()}; res(null); };
    });
  },
  async tx(store, mode, fn) {
    const db = await this.open();
    if (!db) { const m = this._mem[store]; return fn({ getAll: () => ({result: [...m.values()]}), get: k => ({result: m.get(k)}), put: v => { m.set(v.id, v); return {result: v.id}; }, delete: k => { m.delete(k); return {}; }, clear: () => { m.clear(); return {}; } }).result; }
    return new Promise((res, rej) => { const t = db.transaction(store, mode); const req = fn(t.objectStore(store)); t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('abort')); });
  },
  all() { return this.tx('lectures', 'readonly', s => s.getAll()); },
  get(id) { return this.tx('lectures', 'readonly', s => s.get(id)); },
  put(l) { l.updatedAt = Date.now(); return this.tx('lectures', 'readwrite', s => s.put(JSON.parse(JSON.stringify(l)))); },
  async del(id) { await this.tx('lectures', 'readwrite', s => s.delete(id)); await this.tx('blobs', 'readwrite', s => s.delete(id)); await this.tx('canvas', 'readwrite', s => s.delete(id)).catch(() => {}); },
  async getParts(id) { const r = await this.tx('blobs', 'readonly', s => s.get(id)); return r ? r.parts : []; },
  getImg(id) { return this.tx('images', 'readonly', s => s.get(id)).catch(() => null); },
  putImg(rec) { return this.tx('images', 'readwrite', s => s.put(rec)).catch(() => null); },
  putParts(id, parts) { return this.tx('blobs', 'readwrite', s => s.put({id, parts})); },
  async clear() { await this.tx('meta', 'readwrite', s => s.clear()).catch(() => {}); Meta.c = {}; await this.tx('lectures', 'readwrite', s => s.clear()); await this.tx('blobs', 'readwrite', s => s.clear()); await this.tx('images', 'readwrite', s => s.clear()); }
};

/* ---------------- markdown + math ---------------- */
if (window.marked) marked.setOptions({gfm: true, breaks: true});
function renderMd(text) {
  const vts = [], ics = [], steps = [];
  let src = String(text || '').replace(/```steps[ \t]*\n([\s\S]*?)```/g, (m, body) => { steps.push(body.split('\n').map(x => x.replace(/^\s*(?:\d+[.)\-]|[-*•])\s*/, '').trim()).filter(Boolean)); return `\n\n@@STEP${steps.length - 1}@@\n\n`; });
  src = src.replace(/\[\[[^\]\n]*$/, '').replace(/\{\{[^}\n]*$/, '').replace(VT_RE, (m, a, b, c) => { vts.push([a, b, c]); return `@@VT${vts.length - 1}@@`; }).replace(IC_RE, (m, a, b) => { ics.push([a, b]); return `@@IC${ics.length - 1}@@`; });
  const maths = [];
  const prot = src.replace(/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$(?![\s\d])([^$\n]+?)(?<!\s)\$/g, (m, a, b, c, d) => {
    const display = a !== undefined || b !== undefined; maths.push({tex: a ?? b ?? c ?? d, display}); return `@@MATH${maths.length - 1}@@`; });
  let html;
  try { html = window.marked ? marked.parse(prot) : esc(prot).replace(/\n/g, '<br>'); } catch { html = esc(prot).replace(/\n/g, '<br>'); }
  html = window.DOMPurify ? DOMPurify.sanitize(html, {ADD_ATTR: ['target']}) : html;
  html = html.replace(/@@MATH(\d+)@@/g, (m, i) => {
    const x = maths[+i]; if (!x) return '';
    if (window.katex) { try { return katex.renderToString(x.tex, {displayMode: x.display, throwOnError: false, output: 'html'}); } catch {} }
    return `<code>${esc(x.tex)}</code>`;
  });
  html = html.replace(/@@VT(\d+)@@/g, (m, i) => { const v = vts[+i]; return v ? vtChip(v[0], v[1], v[2]) : ''; }).replace(/@@IC(\d+)@@/g, (m, i) => { const v = ics[+i]; return v ? icChip(v[0], v[1]) : ''; });
  html = html.replace(/(?:<p>)?@@STEP(\d+)@@(?:<\/p>)?/g, (m, i) => stepperHTML(steps[+i] || []));
  html = html.replace(/<blockquote>\s*<p>(🔁|💡|⚠️|🤔|🎯|❓|🧠|📌)/g, (m, e) => `<blockquote class="callout c-${{'🔁': 'remind', '💡': 'tip', '⚠️': 'warn', '🤔': 'why', '🎯': 'goal', '❓': 'q', '🧠': 'mem', '📌': 'note'}[e]}"><p>${e}`);
  return html;
}
function inlineMd(t) { return renderMd(String(t || '')).replace(/^\s*<p>|<\/p>\s*$/g, ''); }

async function aiContents(lec, prompt) { return [{role: 'user', parts: [...await lectureParts(lec, prompt), {text: prompt}]}]; }
// Runs a Gemini call built from the lecture; if an uploaded file expired (48h) or belongs to another key, re-uploads and retries once.
async function withLecture(lec, prompt, run) {
  let contents = await aiContents(lec, prompt);
  try { return await run(contents); }
  catch (e) {
    if (!(e instanceof AIError) || e.code !== 'fileExpired') throw e;
    GFiles.invalidate(lec); contents = await aiContents(lec, prompt); return await run(contents);
  }
}
async function aiJSON(lec, prompt, schema, validate, {temperature = 0.4, system} = {}) {
  return withLecture(lec, prompt, async contents => {
    let lastErr = null;
    for (let i = 0; i < 2; i++) {
      const txt = await geminiRequest({contents, system: system || systemPrompt(), json: true, schema, temperature});
      const obj = parseJSONLoose(txt);
      if (obj && (!validate || validate(obj))) return obj;
      lastErr = new AIError('وصل رد غير مكتمل من الذكاء الاصطناعي. حاول مرة أخرى.', 'parse', true);
      contents[0].parts.push({text: 'تنبيه مهم: الرد السابق لم يكن JSON صالحاً أو كان ناقصاً. أعد الإجابة بـ JSON صالح فقط ومطابق للمخطط تماماً، وبعدد عناصر أقل إن لزم.'});
    }
    throw lastErr;
  });
}
async function aiStream(lec, prompt, onChunk, {temperature = 0.7, system, history} = {}) {
  return withLecture(lec, prompt, async contents => {
    if (history) contents = history(contents);
    const sys = system || systemPrompt();
    try { return await geminiRequest({contents, system: sys, stream: true, onChunk, temperature}); }
    catch (e) {
      if (!(e.code === 'network' || e.code === 'cut' || e.name === 'TypeError') || e.code === 'fileExpired') throw e;
      if (e.code === 'cut') { try { return await geminiRequest({contents, system: sys, stream: true, onChunk, temperature}); } catch (e2) { if (e2.code !== 'cut') throw e2; } }
      const t = await geminiRequest({contents, system: sys, temperature}); onChunk && onChunk(t, t); return t;
    }
  });
}

const S = {

    keyPoints: S.arr(S.str),
    outline: S.arr(S.obj({title: S.str, summary: S.str, ref: S.str, subtopics: S.arr(S.str)})),
    glossary: S.arr(S.obj({term: S.str, definition: S.str, example: S.str, sectionIndex: S.int, aliases: S.arr(S.str), confusedWith: S.str, leadsTo: S.str, abbr: S.str, category: {type: 'STRING', enum: ['structure', 'function', 'disease', 'drug', 'concept']}}, ['term', 'definition', 'example'])),
    suggestedQuestions: S.arr(S.str)
  }),
  check: S.obj({question: S.str, options: S.arr(S.str), correctIndex: S.int, explanation: S.str}),
  quiz: S.obj({questions: S.arr(S.obj({type: {type: 'STRING', enum: ['mcq', 'tf', 'fill']}, question: S.str, options: S.arr(S.str), correctIndex: S.int, answer: S.str, alternatives: S.arr(S.str), explanation: S.str, optionExplanations: S.arr(S.str), section: S.str, sectionIndex: S.int, ref: S.str}, ['type', 'question', 'explanation']))}),
  cards: S.obj({cards: S.arr(S.obj({front: S.str, back: S.str, section: S.str}))}),
  grade: S.obj({score: S.int, verdict: S.str, correct: S.arr(S.str), missed: S.arr(S.str), misconceptions: S.arr(S.str), modelAnswer: S.str, tip: S.str}),
  rapid: S.obj({questions: S.arr(S.obj({question: S.str, answer: S.str, keywords: S.arr(S.str)}))}),
  short: S.obj({score: S.int, correct: S.bool, feedback: S.str}),
  predict: S.obj({questions: S.arr(S.obj({question: S.str, type: S.str, likelihood: {type: 'STRING', enum: ['عالية', 'متوسطة', 'منخفضة']}, why: S.str, modelAnswer: S.str}))})
};
function normQuiz(qs) {
  const tf = Settings.get('lang', 'ar') === 'en_terms' ? ['True', 'False'] : ['صح', 'خطأ'];
  return (qs || []).map(q => {
    q = {...q, id: uid()};
    if (q.type === 'tf') { const ci = Number.isInteger(q.correctIndex) ? q.correctIndex : (/^(true|صح|صحيح)/i.test(q.answer || '') ? 0 : 1); q.options = tf; q.correctIndex = ci === 0 ? 0 : 1; if (!q.optionExplanations || q.optionExplanations.length !== 2) q.optionExplanations = []; }
    else if (q.type === 'fill') { if (!q.answer && q.options && q.options[q.correctIndex]) q.answer = q.options[q.correctIndex]; if (!/_{3,}|\.\.\.|…/.test(q.question)) q.question += ' ______'; q.options = []; }
    else {
      q.type = 'mcq';
      if (!Array.isArray(q.options) || q.options.length < 2 || !(q.correctIndex >= 0 && q.correctIndex < q.options.length)) return null;
      const ex = q.optionExplanations && q.optionExplanations.length === q.options.length ? q.optionExplanations : q.options.map(() => '');
      const order = shuffle(q.options.map((_, i) => i));
      q.options = order.map(i => q.options[i]); q.optionExplanations = order.map(i => ex[i]); q.correctIndex = order.indexOf(q.correctIndex);
    }
    if (q.type === 'fill' && !q.answer) return null;
    return q;
  }).filter(Boolean);
}

`### 🧒 The idea, simply\nThe heart is a **house with four rooms**: two upper rooms **receive** blood, two lower rooms **pump** it out.\n\n### 📖 Step by step\n1. [[Right atrium|right atrium|anatomy]]: receives **deoxygenated** blood returning from the body.\n2. [[Right ventricle|right ventricle|anatomy]]: pumps it to the [[lungs|lung|anatomy]] to pick up oxygen.\n3. [[Left atrium|left atrium|anatomy]]: receives **oxygenated** blood from the lungs.\n4. [[Left ventricle|left ventricle|anatomy]]: pumps it to the whole body — so its wall is much thicker (about 3×).\n5. [[Septum|interventricular septum|anatomy]]: the wall that keeps right and left blood apart.\n\n> 💡 **Trick:** Atrium = Arrive · Ventricle = Vent out.`,
`### 🧒 The idea, simply\nBetween the rooms there are **one-way doors** (valves) so blood only moves forward.\n\n### 📖 Step by step\n1. Right atrium → right ventricle: [[tricuspid valve|tricuspid valve|anatomy]] (3 cusps).\n2. Left atrium → left ventricle: [[mitral valve|mitral valve|anatomy]] (2 cusps, shaped like a bishop's mitre).\n3. The cusps are held by [[chordae tendineae|chordae tendineae|anatomy]] anchored to [[papillary muscles|papillary muscle|anatomy]] — like tent ropes.\n4. Exits: [[pulmonary valve|pulmonary valve|anatomy]] (right ventricle) and [[aortic valve|aortic valve|anatomy]] (left ventricle).\n5. "Lub" = S1 (tricuspid + mitral close), "dub" = S2 (pulmonary + aortic close).`,
`### 🧒 The idea, simply\nBlood makes **two trips**: a short one to the lungs to load oxygen, and a long one to the body to deliver it.\n\n### 📖 Step by step\n1. In through the [[superior|superior vena cava|anatomy]] and [[inferior vena cava|inferior vena cava|anatomy]] → right atrium.\n2. Tricuspid valve → right ventricle.\n3. Pulmonary valve → [[pulmonary artery|pulmonary artery|anatomy]] → lungs (oxygen loaded).\n4. Back via the [[pulmonary veins|pulmonary veins|anatomy]] → left atrium.\n5. Mitral valve → left ventricle.\n6. Aortic valve → [[aorta|aorta|anatomy]] → whole body.\n\nThe heart feeds itself through the [[coronary arteries|coronary arteries|anatomy]] — the first branches of the aorta.\n\n> ⚠️ **Classic trap:** the pulmonary artery carries **deoxygenated** blood — it is an artery because it leaves the heart.`,
`### 🧒 The idea, simply\nThe heart wall has **3 layers**, and it has its own built-in **electrical wiring**.\n\n### 📖 Step by step\n1. Layers: [[epicardium|epicardium|anatomy]] → [[myocardium|myocardium|anatomy]] → [[endocardium|endocardium|anatomy]].\n2. The [[SA node|sinoatrial node|anatomy]] in the right atrium fires 60–100 times per minute.\n3. The [[AV node|atrioventricular node|anatomy]] delays the signal ~0.1 s so the ventricles can fill.\n4. Then the [[bundle of His|bundle of His|anatomy]] → [[Purkinje fibers|Purkinje fibers|anatomy]] → the ventricles contract.\n5. We record this electricity with an [[ECG|electrocardiography|diagram]].\n\n> 💡 **Trick:** "Sami Ate Hot Pizza" = SA → AV → His → Purkinje.`];

/* ---------------- Study plan (local, deterministic) ---------------- */
function buildPlan(lec, examDate, daily) {
  const ov = lec.cache.overview; const secs = ov.outline; const today = new Date(dayKey()); const exam = new Date(examDate);
  const days = Math.max(1, Math.round((exam - today) / DAY)); const perSec = Math.max(10, Math.round((ov.studyMinutes || 45) * 1.2 / secs.length));
  const tasks = [];
  secs.forEach((s, i) => tasks.push({title: `اشرح لي: ${s.title}`, min: perSec, tab: 'tutor', sec: i, phase: 1}));
  secs.forEach((s, i) => { if (i % 2 === 1 || i === secs.length - 1) tasks.push({title: `اختبار قصير على الأقسام حتى «${s.title}»`, min: 10, tab: 'quiz', phase: 1}); });
  secs.forEach((s, i) => tasks.push({title: `سمّع: ${s.title}`, min: 8, tab: 'recite', sec: i, phase: 2}));
  tasks.push({title: 'اختبار شامل (٢٠ سؤال) + اختبرني في أخطائي', min: 25, tab: 'quiz', phase: 2});
  tasks.push({title: 'راجع الخريطة الذهنية كاملة', min: 10, tab: 'mindmap', phase: 2});
  const final = [{title: 'اقرأ ملخص ليلة الاختبار', min: 15, tab: 'cheat'}, {title: 'جاوب الأسئلة المتوقعة', min: 25, tab: 'predict'}, {title: 'سمّع لي: جولة سريعة على كل الأقسام', min: 10, tab: 'recite'}];
  const plan = []; const cardsT = () => ({title: 'راجع الكروت المستحقة', min: Math.min(15, Math.max(5, Math.round(daily * .15))), tab: 'cards'});
  const studyDays = days > 1 ? days - 1 : 1; const queue = tasks.slice();
  for (let d = 0; d < studyDays; d++) {
    const date = new Date(today.getTime() + d * DAY); const day = {date: dayKey(date), tasks: []}; let used = 0;
    if (d > 0 || days === 1) { const c = cardsT(); day.tasks.push(c); used += c.min; }
    const remainingDays = studyDays - d; const share = Math.ceil(queue.length / remainingDays);
    let taken = 0;
    while (queue.length && (used + queue[0].min <= daily || day.tasks.length === 0 || taken < share && used < daily * 1.25)) { const t = queue.shift(); day.tasks.push(t); used += t.min; taken++; if (used >= daily * 1.25) break; }
    plan.push(day);
  }
  if (queue.length) plan[plan.length - 1].tasks.push(...queue);
  if (days > 1) plan.push({date: dayKey(new Date(today.getTime() + (days - 1) * DAY)), tasks: [cardsT(), ...final], final: true}); else plan[0].tasks.push(...final);
  plan.forEach(d => d.tasks = d.tasks.map(t => ({...t, id: uid(), done: false})));
  return {exam: examDate, daily, created: Date.now(), days: plan};
}

const Pomo = {
  modes: {focus: [25, 'تركيز'], short: [5, 'استراحة قصيرة'], long: [15, 'استراحة طويلة']},
  mode: 'focus', remaining: 25 * 60, end: 0, running: false, open: false, t: null, count: 0,
  fmt() { const s = Math.max(0, Math.round(this.running ? (this.end - Date.now()) / 1000 : this.remaining)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); },
  toggleWidget() { this.open = !this.open; this.render(); },
  set(m, mins) { this.mode = m; this.running = false; clearInterval(this.t); this.remaining = (mins || this.modes[m][0]) * 60; this.total = this.remaining; this.save(); this.render(); renderChrome(); },
  start() { if (this.running) { this.remaining = Math.round((this.end - Date.now()) / 1000); this.running = false; clearInterval(this.t); } else { this.end = Date.now() + this.remaining * 1000; this.running = true; clearInterval(this.t); this.t = setInterval(() => this.tick(), 500); } this.save(); this.render(); renderChrome(); },
  startFocus(mins = 25) { this.breakQ = null; this.set('focus', mins); this.start(); },
  // survives reloads and view changes: the end timestamp is the source of truth
  save() { Settings.set('pomoState', {mode: this.mode, running: this.running, end: this.end, remaining: this.remaining, total: this.total, count: this.count, day: dayKey()}); },
  restore() {
    const p = Settings.get('pomoState', null); if (!p || !this.modes[p.mode]) return;
    this.mode = p.mode; this.count = p.day === dayKey() ? p.count || 0 : 0; this.total = p.total || this.modes[p.mode][0] * 60;
    if (p.running && p.end > Date.now()) { this.end = p.end; this.remaining = Math.round((p.end - Date.now()) / 1000); this.running = true; this.t = setInterval(() => this.tick(), 500); }
    else if (p.running) { this.running = false; this.remaining = this.modes[this.mode === 'focus' ? 'short' : 'focus'][0] * 60; this.mode = this.mode === 'focus' ? 'short' : 'focus'; this.total = this.remaining; this.save(); }
    else this.remaining = p.remaining || this.modes[p.mode][0] * 60;
  },
  async pickBreakQ() {
    try { const all = await Lib.load(); const cur = App.lec ? Subjects.idOf(App.lec) : null;
      const pool = all.filter(l => !cur || Subjects.idOf(l) === cur).flatMap(l => (l.cards || []).map(c => ({c, l}))).filter(x => x.c.reviews);
      const due = pool.filter(x => x.c.due <= Date.now()); const pick = (due.length ? due : pool)[Math.floor(Math.random() * Math.max(1, (due.length ? due : pool).length))];
      if (pick) return {front: pick.c.front, back: pick.c.back, lec: pick.l.title};
      const gl = all.flatMap(l => ((l.cache && l.cache.overview && l.cache.overview.glossary) || []).map(g => ({front: `وش معنى «${plain(g.term)}»؟`, back: g.definition, lec: l.title})));
      return gl.length ? gl[Math.floor(Math.random() * gl.length)] : null; } catch { return null; }
  },
  reset() { this.set(this.mode); },
  tick() {
    const left = (this.end - Date.now()) / 1000;
    const tv = $('#pomo .ptime'); if (tv) tv.textContent = this.fmt(); const mb = $('#pomo-btn .pomo-mini'); if (mb) mb.textContent = this.fmt();
    if (left <= 0) { clearInterval(this.t); this.running = false; this.beep();
      if (this.mode === 'focus') { this.count++; Activity.mark('pomo'); toast('🍅 خلصت جلسة تركيز! خذ استراحة قصيرة', 'ok', 6000); this.set(this.count % 4 === 0 ? 'long' : 'short'); this.start(); this.pickBreakQ().then(q => { if (!q || this.mode === 'focus') return; this.breakQ = q; this.open = true; this.render(); }); }

      try { if ('Notification' in window && Notification.permission === 'granted') new Notification('ذاكِر', {body: this.mode === 'focus' ? 'انتهت الاستراحة' : 'انتهت جلسة التركيز 🍅'}); } catch {} }
  },
  beep() { try { const C = new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach(d => { const o = C.createOscillator(), g = C.createGain(); o.frequency.value = 880; o.connect(g); g.connect(C.destination); g.gain.setValueAtTime(.0001, C.currentTime + d); g.gain.exponentialRampToValueAtTime(.3, C.currentTime + d + .02); g.gain.exponentialRampToValueAtTime(.0001, C.currentTime + d + .2); o.start(C.currentTime + d); o.stop(C.currentTime + d + .22); }); } catch {} },
  render() {

    root.innerHTML = `<div id="pomo" role="dialog" aria-label="مؤقت بومودورو"><div class="row nowrap"><b>🍅 بومودورو</b><span class="spacer"></span><span class="tiny muted">${arNum(this.count)} جلسة</span><button class="icon-btn" id="pm-x" aria-label="إغلاق" style="width:32px;height:32px">${icon('x')}</button></div>
      <div class="pmode" style="margin-top:8px">${Object.entries(this.modes).map(([k, v]) => `<button class="btn btn-sm ${k === this.mode ? 'btn-primary' : 'btn-ghost'}" data-pm="${k}" style="padding:5px 9px;font-size:.76rem">${v[1]}</button>`).join('')}</div>
      <div class="ptime">${this.fmt()}</div><div class="progress"><i style="width:${(1 - left / total) * 100}%"></i></div>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn btn-primary" id="pm-go">${icon(this.running ? 'pause' : 'play')} ${this.running ? 'إيقاف مؤقت' : 'ابدأ'}</button><button class="btn btn-ghost" id="pm-reset" aria-label="إعادة">${icon('refresh')}</button></div>

  }
};

/* flip-deck used by "ذكّرني" and smart review */
function flipDeck(box, items, onRate, onDone) {
  let i = 0; const stats = {again: 0, hard: 0, mid: 0, easy: 0};
  const draw = () => {
    if (i >= items.length) return onDone(stats);
    const it = items[i]; const sj = it.lec && typeof Subjects !== 'undefined' ? Subjects.of(it.lec) : null;
    box.innerHTML = `<div class="deck fade-in"><div class="row small muted" style="justify-content:space-between"><span>${arNum(i + 1)} / ${arNum(items.length)}</span>${it.lec ? `<a class="chip" href="#/lec/${encodeURIComponent(it.lec.id)}/overview">${sj && sj.id !== 'none' ? sj.emoji : '📚'} ${esc(it.lec.title.slice(0, 40))}</a>` : ''}</div>
      <div class="progress" style="margin:8px 0 14px"><i style="width:${i / items.length * 100}%"></i></div>
      <div class="card deck-card">${it.tag ? `<span class="chip tiny">${esc(it.tag)}</span>` : ''}<div class="md deck-front">${renderMd(it.front)}</div><div class="deck-back" hidden><hr class="divider"><div class="md">${renderMd(it.back)}</div></div></div>
      <div class="row deck-acts" style="justify-content:center;margin-top:14px"><button class="btn btn-primary btn-lg" data-d="flip">اكشف الإجابة</button></div></div>`;
    $('[data-d="flip"]', box).onclick = () => {
      $('.deck-back', box).hidden = false;

      $('.deck-acts', box).innerHTML = `<div class="rate" style="margin-top:0;width:100%">${RATE_KEYS.map(k => `<button class="btn ${k}" data-r="${k}"><span><i class="r-dot" aria-hidden="true"></i>${RATE[k][1]}</span>${c ? `<small>${fmtInterval(nextDue(c, k).due - Date.now())}</small>` : ''}</button>`).join('')}</div>`;
      let busy = false;
      $$('[data-r]', box).forEach(b => b.onclick = async () => { if (busy) return; busy = true; stats[b.dataset.r]++; await onRate(it, b.dataset.r); i++; draw(); });

}

function rivalBar(Q) { const R = Q.rival; const me = Q.answers.filter(a => a && a.ok).length; const n = Q.qs.length; return `<div class="rival"><div class="rv-row"><span>أنت</span><div class="progress"><i style="width:${me / n * 100}%"></i></div><b>${arNum(me)}</b></div><div class="rv-row bot"><span>🤖 ذاكِر بوت</span><div class="progress"><i style="width:${R.score / n * 100}%"></i></div><b>${arNum(R.score)}</b></div></div>`; }
function rivalStep(Q, ok) { const R = Q.rival; const hit = Math.random() < R.p; if (hit) R.score++; R.hist.push(hit); R.p = clamp(R.p + (ok ? .05 : -.06), .35, .95); const bar = $('.rival'); if (bar) bar.outerHTML = rivalBar(Q); }
function rivalResult(Q, score) { const R = Q.rival; const w = score > R.score ? 'win' : score === R.score ? 'tie' : 'lose'; if (w === 'win') setTimeout(() => confetti(90), 300); return `<div class="card race-res ${w}"><div class="race-av">${w === 'win' ? '🏆' : w === 'tie' ? '🤝' : '🤖'}</div><div><h3 style="margin:0">${w === 'win' ? 'غلبت ذاكِر بوت!' : w === 'tie' ? 'تعادل!' : 'ذاكِر بوت فاز هالمرة'}</h3><div class="small muted">أنت ${arNum(score)} · البوت ${arNum(R.score)}</div></div></div>`; }

/* ---------- a tiny self-contained question runner (pre/post test, mixed session, break question) ---------- */
function MiniQuiz(box, qs, {onDone, label = ''} = {}) {
  let i = 0; const ans = [];
  const draw = () => {
    if (i >= qs.length) return onDone && onDone(ans, ans.filter(a => a.ok).length);
    const q = qs[i];
    box.innerHTML = `<div class="mq fade-in"><div class="row small muted" style="justify-content:space-between"><span>${esc(label)}</span><span>${arNum(i + 1)} / ${arNum(qs.length)}</span></div><div class="progress thin" style="margin:6px 0 14px"><i style="width:${i / qs.length * 100}%"></i></div>
      ${q.tag ? `<span class="chip tiny">${esc(q.tag)}</span>` : ''}<div class="md mq-q">${renderMd(q.question)}</div>
      ${q.type === 'fill' ? `<div class="row nowrap" style="margin-top:12px"><label class="sr-only" for="mq-in">إجابتك</label><input class="input" id="mq-in" autocomplete="off" placeholder="اكتب الإجابة…"><button class="btn btn-primary" id="mq-ok">تحقّق</button></div>` : `<div class="mq-opts stack" style="gap:8px;margin-top:12px">${q.options.map((o, k) => `<button class="opt" data-k="${k}">${rich(o)}</button>`).join('')}</div>`}
      <div id="mq-fb"></div></div>`;
    let answered = false;
    const finish = (ok, given) => {
      if (answered) return; answered = true; ans.push({q, ok, given});
      const right = q.type === 'fill' ? q.answer : q.options[q.correctIndex];
      $$('.opt', box).forEach(b => { b.disabled = true; const k = +b.dataset.k; if (k === q.correctIndex) b.classList.add('correct'); else if (String(k) === String(given)) b.classList.add('wrong'); });
      $('#mq-fb', box).innerHTML = `<div class="alert ${ok ? 'ok' : 'warn'}" style="margin-top:12px"><div style="flex:1"><b>${ok ? '✓ صح' : '✗ الإجابة: ' + esc(plain(right || ''))}</b>${q.explanation ? `<div class="small md">${renderMd(q.explanation)}</div>` : ''}</div></div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn btn-primary" id="mq-next">${i + 1 < qs.length ? 'التالي' : 'النتيجة'} ${icon('next')}</button></div>`;
      $('#mq-next', box).onclick = () => { i++; draw(); }; $('#mq-next', box).focus();
    };
    $$('.opt', box).forEach(b => b.onclick = () => finish(+b.dataset.k === q.correctIndex, +b.dataset.k));
    const inp = $('#mq-in', box); if (inp) { const check = () => { const v = normAr(inp.value); if (!v) return; const ok = [q.answer, ...(q.alternatives || [])].filter(Boolean).some(a => { const n = normAr(a); return n && (v === n || (n.length > 3 && (v.includes(n) || n.includes(v) && v.length >= n.length * .7))); }); inp.disabled = true; finish(ok, inp.value); }; $('#mq-ok', box).onclick = check; inp.onkeydown = e => { if (e.key === 'Enter') check(); }; }
  };
  draw();
}

/* ---------- interleaving: «خلط المواضيع» ---------- */
function mixPool(lecs) {
  const per = lecs.map(l => {
    const ov = l.cache && l.cache.overview; if (!ov) return [];
    const out = []; const gl = (ov.glossary || []).filter(g => g.term && g.definition);
    gl.forEach((g, k) => { const others = shuffle(gl.filter(x => x !== g)).slice(0, 3); if (others.length < 2) return;
      const opts = shuffle([g, ...others]); out.push({type: 'mcq', question: `وش المقصود بـ **${plain(g.term)}**؟`, options: opts.map(x => stripMd(x.definition).slice(0, 140)), correctIndex: opts.indexOf(g), explanation: g.example ? 'مثال: ' + g.example : '', tag: `${Subjects.of(l).emoji} ${l.title.slice(0, 26)} · ${(ov.outline[g.sectionIndex] || {}).title || 'مصطلحات'}`, lec: l.id, sec: g.sectionIndex}); });
    (l.cards || []).slice(0, 30).forEach(c => out.push({type: 'card', card: c, lecObj: l, front: c.front, back: c.back, tag: `${Subjects.of(l).emoji} ${l.title.slice(0, 26)} · ${c.section || ''}`, lec: l.id, sec: c.section}));
    return shuffle(out);
  });
  // round-robin across lectures & sections → never two in a row from the same topic when avoidable
  const res = []; let last = null; let guard = 0;
  while (per.some(p => p.length) && guard++ < 2000) { for (const p of shuffle(per.filter(x => x.length))) { let k = p.findIndex(x => (x.lec + '|' + x.sec) !== last); if (k < 0) k = 0; const it = p.splice(k, 1)[0]; res.push(it); last = it.lec + '|' + it.sec; } }
  return res;
}

/* ---------- reminders: in-app banner + sound + system notification when allowed ---------- */
const Reminders = {
  t: null,
  start() { clearInterval(this.t); this.t = setInterval(() => this.tick(), 20000); document.addEventListener('visibilitychange', () => { if (!document.hidden) this.tick(); }); setTimeout(() => this.tick(), 1500); },
  async tick() {
    const now = Date.now(); let list = Planner.items(); let dirty = false; const fire = [];
    for (const it of list) {
      if (it.done || !it.due || it.remind == null || it.remind < 0) continue;
      const at = it.snooze || (it.due - it.remind * 60e3); const key = String(at); it.fired = it.fired || {};
      if (now < at || it.fired[key]) continue;
      it.fired[key] = now; dirty = true; if (it.snooze && now >= it.snooze) delete it.snooze;
      if (now - at < 12 * 3600e3) fire.push(it);
    }
    if (dirty) await Meta.set('planner', list);
    fire.slice(0, 3).forEach(it => this.show(it));
    try { Study.notifyCheck(Lib.list || []); } catch {}
    $$('[data-cd]').forEach(e => { e.textContent = countdown(+e.dataset.cd); });
  },
  show(it) {
    const root = $('#alarm-root'); if (!root) return; const s = Subjects.get(it.subject); const [e, l] = PL_TYPES[it.type];
    const el = document.createElement('div'); el.className = 'alarm fade-in'; el.setAttribute('role', 'alert'); el.dataset.id = it.id;
    el.innerHTML = `<span class="al-e" aria-hidden="true">${e}</span><div style="flex:1;min-width:0"><b>${esc(it.title)}</b><div class="small">${s.id !== 'none' ? esc(s.emoji + ' ' + s.name) + ' · ' : ''}${esc(l)} · ${it.due > Date.now() ? countdown(it.due) : 'الحين'}</div></div><button class="btn btn-sm" data-al="snooze">غفوة ١٠ د</button><button class="btn btn-sm btn-primary" data-al="ok">تمام</button>`;
    root.appendChild(el); try { Pomo.beep(); } catch {}
    Notify.show('ذاكِر ' + e, `${it.title} — ${it.due > Date.now() ? countdown(it.due) : 'الحين'}`, 'pl:' + it.id);
    el.onclick = async ev => { const b = ev.target.closest('[data-al]'); if (!b) return; if (b.dataset.al === 'snooze') { const L = Planner.items(); const x = L.find(y => y.id === it.id); if (x) { x.snooze = Date.now() + 10 * 60e3; await Meta.set('planner', L); } } el.remove(); };
    setTimeout(() => el.isConnected && el.classList.add('al-quiet'), 60000);
  }
};

  mode() { const t = Settings.get('theme', null); return ['light', 'dark', 'auto'].includes(t) ? t : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); },
  night(d = new Date()) { const h = d.getHours(); return h >= 19 || h < 6; },
  resolve(m = this.mode()) { return m === 'auto' ? (this.night() ? 'night' : 'light') : m; },
  apply() { const t = this.resolve(); if (document.documentElement.getAttribute('data-theme') !== t) { document.documentElement.setAttribute('data-theme', t); const mc = $('meta[name="theme-color"]'); if (mc) mc.content = t === 'night' ? '#1d1712' : t === 'dark' ? '#13131c' : '#6c5ce7'; return true; } return false; },
  start() { this.apply(); setInterval(() => { if (this.mode() === 'auto' && this.apply()) { renderChrome(); if (App.tab === 'mindmap') VIEWS.mindmap(); } }, 60000); }
